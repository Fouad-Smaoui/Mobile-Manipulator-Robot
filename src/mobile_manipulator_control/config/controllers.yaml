controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mobile_base_controller:
      type: diff_drive_controller/DiffDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

mobile_base_controller:
  ros__parameters:
    left_wheel_names: ['front_left_wheel_joint', 'rear_left_wheel_joint']
    right_wheel_names: ['front_right_wheel_joint', 'rear_right_wheel_joint']

    # Derived from the actual STL meshes, not assumed: wheel centers are
    # at base.xacro y=+-0.250 (separation 0.500); wheel.stl's bounding
    # box after the URDF's own roll rotation gives a wheel radius of
    # ~0.0997m, not the 0.0625m the original repo's control.yaml assumed
    # without checking the mesh.
    wheel_separation: 0.500
    wheel_radius: 0.0997

    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
    publish_rate: 50.0

    cmd_vel_timeout: 0.5
    # No use_stamped_vel param on this ros2_controllers version (Jazzy,
    # 4.45.2) -- verified via `ros2 param get`, it doesn't exist.
    # /mobile_base_controller/cmd_vel is unconditionally
    # geometry_msgs/msg/TwistStamped here.

    linear.x.max_velocity: 2.0
    linear.x.max_acceleration: 3.0
    angular.z.max_velocity: 3.0
    angular.z.max_acceleration: 6.0

arm_controller:
  ros__parameters:
    joints:
      - arm_base_joint
      - shoulder_joint
      - bottom_wrist_joint
      - elbow_joint
      - top_wrist_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.5
    allow_partial_joints_goal: false
