bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /mobile_base_controller/odom
    # default_nav_to_pose_bt_xml is set in navigation.launch.py instead of
    # here -- a static params YAML can't use launch-time path
    # substitution (find-pkg-share only resolves inside launch files).

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    # AUDIT FIX: verified live (`ros2 topic info /mobile_base_controller/cmd_vel
    # --verbose`) that controller_server was publishing plain geometry_msgs/Twist
    # while mobile_base_controller (diff_drive_controller) subscribes with
    # TwistStamped -- a DDS type mismatch, so no command from Nav2 was ever
    # actually delivered to the robot regardless of what the action status
    # reported. Same Twist->TwistStamped migration this project already hit
    # with teleop_twist_keyboard; Nav2's controller_server/behavior_server
    # default this to false for backward compat.
    enable_stamped_cmd_vel: true
    # AUDIT FIX: verified live (`ros2 topic info /odom --verbose`) that
    # controller_server's odom subscription has zero matching publishers --
    # it defaults to the bare topic name "odom", but the real odometry is
    # published at /mobile_base_controller/odom (never remapped to plain
    # /odom anywhere). This starves RegulatedPurePursuitController's
    # odom_smoother of real velocity feedback used by
    # use_velocity_scaled_lookahead_dist. bt_navigator already had this
    # set correctly; controller_server did not.
    odom_topic: /mobile_base_controller/odom

    # RELIABILITY FIX: SimpleProgressChecker only measures translational
    # displacement. RegulatedPurePursuitController rotates in place to
    # face the path's initial heading before it starts driving (normal,
    # correct behavior, not a bug) -- with the old 10s/0.5m budget, a
    # goal requiring a sharp turn could exhaust the whole allowance just
    # rotating, get flagged "stalled", and abort before ever moving
    # forward. Confirmed via controller_server log: several real aborts
    # showed "Failed to make progress" while the robot was actively
    # mid-rotation, not actually stuck. Widened the time budget and
    # loosened the radius so small/slow real movement still counts.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      max_angular_accel: 3.2
      min_turning_radius: 0.0
      use_velocity_scaled_lookahead_dist: true
      # RELIABILITY FIX: faster in-place rotation shortens the window
      # where the robot makes zero translational progress (by design,
      # while turning to face the path) before the progress_checker
      # above sees real forward motion. Complements the progress_checker
      # widening: this shrinks the stall risk, the other widens the
      # budget for it.
      rotate_to_heading_angular_vel: 2.5
      # AUDIT FIX: verified live (controller_server log) that slam_toolbox's
      # map->odom TF publish timing is irregular enough under this
      # CPU-constrained WSL test environment that RPPPathHandler's
      # transformPose lookups intermittently land ~50ms before the TF
      # buffer's earliest retained sample ("Lookup would require
      # extrapolation into the past"), aborting the goal with TF_ERROR.
      # The default tolerance did not absorb this; widened explicitly.
      transform_tolerance: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # Rectangular footprint, not a circular robot_radius -- this base
      # is 0.65m x 0.40m at the chassis (per robot_base.stl) with wheels
      # protruding further in y (mounted at +-0.250 in base.xacro, plus
      # wheel half-width), not a circular platform. A robot_radius here
      # would be the same simplification turtlebot/kobuki-style circular
      # bases use, which understates this robot's footprint in y.
      footprint: "[[0.33, -0.30], [0.33, 0.30], [-0.33, 0.30], [-0.33, -0.30]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          # AUDIT FIX: verified live via `ros2 param get
          # /local_costmap/local_costmap obstacle_layer.scan.max_obstacle_height`
          # that this per-source override defaults to 0.0m (distinct from the
          # layer-level max_obstacle_height: 2.0 default), silently rejecting
          # every LiDAR point as "too high" since lidar_link is mounted at
          # z=0.20m -- the obstacle_layer marked zero cells despite real,
          # confirmed scan hits and valid TF. Not previously set in this file.
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.33, -0.30], [0.33, 0.30], [-0.33, 0.30], [-0.33, -0.30]]"
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          # Same fix as local_costmap's obstacle_layer above.
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5

behavior_server:
  ros__parameters:
    use_sim_time: true
    # AUDIT FIX: same Twist->TwistStamped DDS type mismatch as
    # controller_server above -- behavior_server publishes its own cmd_vel
    # for recovery behaviors (spin/backup) independently.
    enable_stamped_cmd_vel: true
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
